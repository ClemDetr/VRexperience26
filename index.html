<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A frame scene</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>
    <a-assets>
        <img id="brick_bump" src="assets/brick_bump.jpg">
        <img id="sky_texture" src="assets/sky.jpg">
    </a-assets>
  <a-scene>
    <a-entity animation="
    property: 
    position; 
    to: 0 0.4 -4; 
    dur: 4000; 
    loop: true; 
    easing:easeOutQuad;
    " 
    position="0 0.4 -60">
      <a-box position="0 0.1 0" color="#d21e1e" scale="2 0.7 5" material="metalness: 0.5; roughness: 0.5">
        <a-box position="0 0.85 0" color="#d21e1e" scale="0.95 0.7 0.6" material="metalness: 0.5; roughness: 0.5"></a-box>
      </a-box>
      <a-cylinder position="0 0 1" rotation="0 0 90" radius="0.3" height="2.1" color="gray"></a-cylinder>
      <a-cylinder position="0 0 -1" rotation="0 0 90" radius="0.3" height="2.1" color="gray"></a-cylinder>
      
    </a-entity>  

      <a-sphere position="-1.5 0 -2.5" radius="0.2" color="#4197F2" animation="
      property: 
      position; 
      to: 1.5 0 -2.5;
      dur: 2000; 
      loop: true; 
      dir: alternate;
      easing: easeInOutSine;
      "></a-sphere>
      <a-sphere position="0 10 -4" radius="0.2" color="#EF2D5E" animation="
      property: 
      position; 
      to: 0 0 -4; 
      dur: 2000; 
      loop: true; 
      dir: alternate;
      "></a-sphere>

      <a-plane position="0 0 4" rotation="-90 0 0" width="4" height="60" color="#FFFFFF"></a-plane>
      <a-sky src="#sky_texture"></a-sky>
      <a-entity id="light" light="intensity: 5.38; type: ambient" position="0 6.902 0"></a-entity>
  </a-scene>
  
</body>
</html>
