<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A frame scene</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <a-assets>
        <img id="brick_bump" src="assets/brick_bump.jpg">
        <img id="sky_texture" src="assets/sky.jpg">
        <audio id="car" src="assets/driving_car.mp3"></audio>
        <a-asset-item id="well_model" src="assets/well.glb"> </a-asset-item>
        <a-asset-item id="glasshouse" src="assets/VRexp26.glb"></a-asset-item>
    </a-assets>

    <camera>
      <a-cursor material="color: white; opacity: 0.2"></a-cursor>
    </camera>
    <a-entity id="red_car" animation="
    property: 
    position; 
    to: 60 0.4 -5; 
    dur: 10000; 
    loop: true; 
    easing:easeOutQuad;
    " 
    sound="src: #car; autoplay: true; loop: true; refDistance: 20; maxDistance: 100;"
    position="-60 0.4 -5">
      <a-box position="0 0.1 0" rotation="0 90 0" color="#d21e1e" scale="2 0.7 5" material="metalness: 0.5; roughness: 0.5">
        <a-box position="0 0.85 0" rotation="0 90 0" color="#d21e1e" scale="0.95 0.7 0.6" material="metalness: 0.5; roughness: 0.5"></a-box>
      </a-box>
      <a-cylinder position="1 0 0" rotation="90 0 0" radius="0.3" height="2.1" color="gray"></a-cylinder>
      <a-cylinder position="-1 0 0" rotation="90 0 0" radius="0.3" height="2.1" color="gray"></a-cylinder>
      
    </a-entity>  

    <a-entity id="blue_car" animation="
    property: 
    position; 
    to: -60 0.4 -10; 
    dur: 10000; 
    loop: true; 
    easing:easeOutQuad;
    " 
    sound="src: #car; autoplay: true; loop: true; refDistance: 20; maxDistance: 100;"
    position="60 0.4 -10">
      <a-box position="0 0.1 0" rotation="0 90 0" color="blue" scale="2 0.7 5" material="metalness: 0.5; roughness: 0.5">
        <a-box position="0 0.85 0" rotation="0 90 0" color="blue" scale="0.95 0.7 0.6" material="metalness: 0.5; roughness: 0.5"></a-box>
      </a-box>
      <a-cylinder position="1 0 0" rotation="90 0 0" radius="0.3" height="2.1" color="gray"></a-cylinder>
      <a-cylinder position="-1 0 0" rotation="90 0 0" radius="0.3" height="2.1" color="gray"></a-cylinder>
      
    </a-entity> 

    <a-entity id="well" gltf-model="#well_model" position="0 0 14" animation="property: rotation; to: 0 360 0; dur: 5000; loop: true; easing:linear;"></a-entity>
    <a-entity id="glasshouse" gltf-model="assets/VRexp26.glb" position="0 0 -20" rotation="0 90 0" solid="true" anchored="persistent: true"></a-entity>

      <a-plane position="0 0 -8" rotation="-90 90 0" width="9" height="120" color="grey"></a-plane>
      <a-sky src="assets/sky.jpg"></a-sky>

      <a-entity id="light" light="color: #a2a5a1; intensity: 5.38; type: ambient" position="0 6.902 0"></a-entity>
      <a-entity light="color: #c36628; decay: 0.54; intensity: 50; penumbra: 0.68; type: spot; castShadow: true; target: #well" id="spot1-2" position="-2.635 3.181 9.98"></a-entity>
  </a-scene>
  
</body>
</html>
